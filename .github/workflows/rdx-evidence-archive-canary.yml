name: CEREBRON F119 RDX Evidence Archive Canary
on:
  push:
    branches: [main]
    paths:
      - 'config/rdx-evidence-archive-canary-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run pinned RDX evidence archive canary
        run: python worker/rdx_evidence_archive_canary.py
      - name: Verify claim ceiling
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path("artifacts/rdx_evidence_archive_canary.json").read_text())
          assert d["status"]=="PASS"
          assert d["farm_id"]==119
          assert d["training_executed"] is False
          assert d["weights_changed"] is False
          assert all(d["checks"].values())
          print("F119_RDX_EVIDENCE_ARCHIVE=PASS",d["receipt_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f119-rdx-evidence-archive-canary
          path: artifacts/rdx_evidence_archive_canary.json
          if-no-files-found: error
      - name: Persist receipt
        run: |
          mkdir -p receipts
          cp artifacts/rdx_evidence_archive_canary.json receipts/rdx-evidence-archive-canary-${{ github.run_id }}.json
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/rdx-evidence-archive-canary-${{ github.run_id }}.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: F119 RDX evidence archive canary ${{ github.run_id }}"
          git pull --rebase origin main
          git push
